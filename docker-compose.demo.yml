# Catalog only, on built-in demo data. Needs no .env, no database and no backend.
# docker compose -f docker-compose.demo.yml up -d --build   ->  http://localhost:8080
name: inventory-demo

services:
  shop-site:
    build: ./shop-site
    restart: unless-stopped
    environment:
      MOCK_API: "true"
      SITE_URL: http://localhost:8080
    networks: [web]

  nginx:
    image: nginxinc/nginx-unprivileged:1.27-alpine
    restart: unless-stopped
    environment:
      SHOP_DOMAIN: shop.localhost
      ADMIN_DOMAIN: admin.localhost
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - shop-site
    networks: [web]

networks:
  web:
