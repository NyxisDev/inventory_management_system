# /media/ -> backend (FastAPI StaticFiles). Product photos, cached for 7 days.
# Nothing from this folder may run in the browser: no scripts, no framing, no sniffing.
proxy_pass $backend_upstream;
include /etc/nginx/snippets/proxy-headers.conf;
include /etc/nginx/snippets/security-headers.conf;
add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
add_header Cache-Control "public, max-age=604800" always;
expires 7d;
limit_except GET HEAD {
    deny all;
}
