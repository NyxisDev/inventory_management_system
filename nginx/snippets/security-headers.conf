# Security headers. Included again in every location that adds its own headers,
# because add_header in a location replaces the ones from the server block.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# HSTS is added by Caddy in production (HTTPS only), see deploy/Caddyfile.
