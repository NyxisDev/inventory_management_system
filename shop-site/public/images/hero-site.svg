<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
  <!-- Placeholder illustration of a building site at dusk. Replace with a real photo when available. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1426"/>
      <stop offset="0.55" stop-color="#1b2a4d"/>
      <stop offset="0.82" stop-color="#5a3a2a"/>
      <stop offset="1" stop-color="#ff8a00"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.62" cy="0.92" r="0.45">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.9"/>
      <stop offset="0.35" stop-color="#ff8a00" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff8a00" stop-opacity="0"/>
    </radialGradient>
    <pattern id="lattice" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M0 0L24 24M24 0L0 24" stroke="#ffb02e" stroke-width="2.4"/>
      <path d="M0 0H24M0 24H24" stroke="#ffb02e" stroke-width="3"/>
    </pattern>
    <pattern id="latticeH" width="26" height="22" patternUnits="userSpaceOnUse">
      <path d="M0 22L13 0L26 22" fill="none" stroke="#ffb02e" stroke-width="2.4"/>
    </pattern>
    <pattern id="win" width="34" height="40" patternUnits="userSpaceOnUse">
      <rect x="6" y="8" width="18" height="22" fill="#24345a"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#sun)"/>

  <!-- distant city -->
  <g fill="#16223d">
    <rect x="0" y="610" width="90" height="290"/>
    <rect x="80" y="560" width="70" height="340"/>
    <rect x="150" y="640" width="120" height="260"/>
    <rect x="1240" y="590" width="80" height="310"/>
    <rect x="1310" y="540" width="100" height="360"/>
    <rect x="1410" y="620" width="90" height="280"/>
    <rect x="1490" y="580" width="110" height="320"/>
  </g>
  <g fill="url(#win)" opacity="0.8">
    <rect x="80" y="570" width="70" height="320"/>
    <rect x="1310" y="550" width="100" height="340"/>
  </g>

  <!-- building under construction -->
  <g>
    <rect x="520" y="360" width="520" height="540" fill="#121c33"/>
    <g fill="#0e1729">
      <rect x="520" y="420" width="520" height="14"/>
      <rect x="520" y="500" width="520" height="14"/>
      <rect x="520" y="580" width="520" height="14"/>
      <rect x="520" y="660" width="520" height="14"/>
      <rect x="520" y="740" width="520" height="14"/>
      <rect x="520" y="820" width="520" height="14"/>
    </g>
    <g fill="#1d2b4a">
      <rect x="520" y="360" width="16" height="540"/>
      <rect x="650" y="360" width="16" height="540"/>
      <rect x="780" y="360" width="16" height="540"/>
      <rect x="910" y="360" width="16" height="540"/>
      <rect x="1024" y="360" width="16" height="540"/>
    </g>
    <!-- lit windows -->
    <g fill="#ffb347">
      <rect x="560" y="530" width="60" height="40" opacity="0.85"/>
      <rect x="820" y="610" width="70" height="40" opacity="0.7"/>
      <rect x="690" y="770" width="70" height="40" opacity="0.8"/>
      <rect x="950" y="450" width="60" height="40" opacity="0.6"/>
      <rect x="950" y="690" width="60" height="40" opacity="0.75"/>
    </g>
    <!-- scaffolding -->
    <g stroke="#3b4d75" stroke-width="3" fill="none">
      <path d="M1040 360V900M1080 360V900M1040 420H1080M1040 500H1080M1040 580H1080M1040 660H1080M1040 740H1080M1040 820H1080"/>
      <path d="M1040 420L1080 500L1040 580L1080 660L1040 740L1080 820"/>
    </g>
    <!-- top floor frame -->
    <g stroke="#2d3d63" stroke-width="10">
      <path d="M520 360V250M650 360V250M780 360V250M910 360V250M1040 360V250"/>
      <path d="M515 300H1045" stroke-width="8"/>
    </g>
  </g>

  <!-- tower crane 1 -->
  <g>
    <rect x="410" y="150" width="34" height="750" fill="url(#lattice)"/>
    <rect x="200" y="150" width="760" height="24" fill="url(#latticeH)"/>
    <rect x="200" y="170" width="760" height="4" fill="#ffb02e"/>
    <rect x="200" y="150" width="760" height="4" fill="#ffb02e"/>
    <path d="M427 60L427 150M427 60L200 152M427 60L960 152" stroke="#ffb02e" stroke-width="3" fill="none"/>
    <rect x="215" y="174" width="90" height="56" fill="#334155"/>
    <rect x="444" y="176" width="44" height="40" rx="4" fill="#1e293b" stroke="#ffb02e" stroke-width="3"/>
    <path d="M820 174V470" stroke="#cbd5e1" stroke-width="2.5"/>
    <path d="M806 470h28l-6 16h-16z" fill="#cbd5e1"/>
    <g transform="translate(770 486)">
      <path d="M50 0L0 40M50 0L100 40" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="0" y="40" width="100" height="10" fill="#8b5e34"/>
      <g fill="#b45a3c" stroke="#7c2d12" stroke-width="1">
        <rect x="4" y="12" width="30" height="14"/><rect x="35" y="12" width="30" height="14"/><rect x="66" y="12" width="30" height="14"/>
        <rect x="4" y="26" width="30" height="14"/><rect x="35" y="26" width="30" height="14"/><rect x="66" y="26" width="30" height="14"/>
      </g>
    </g>
    <circle cx="960" cy="152" r="5" fill="#ff3b30"/>
  </g>

  <!-- tower crane 2 (far) -->
  <g opacity="0.55">
    <rect x="1180" y="260" width="20" height="640" fill="url(#lattice)"/>
    <rect x="1030" y="260" width="460" height="14" fill="url(#latticeH)"/>
    <rect x="1030" y="260" width="460" height="3" fill="#ffb02e"/>
    <path d="M1190 200V260M1190 200L1030 262M1190 200L1490 262" stroke="#ffb02e" stroke-width="2" fill="none"/>
    <path d="M1420 274V420" stroke="#cbd5e1" stroke-width="2"/>
  </g>

  <!-- ground and material stacks -->
  <rect x="0" y="860" width="1600" height="40" fill="#0a1222"/>
  <g>
    <g transform="translate(130 790)">
      <rect x="0" y="62" width="180" height="10" fill="#8b5e34"/>
      <g fill="#a3a3a3" stroke="#525252">
        <rect x="6" y="38" width="54" height="24" rx="6"/><rect x="62" y="38" width="54" height="24" rx="6"/><rect x="118" y="38" width="54" height="24" rx="6"/>
        <rect x="34" y="14" width="54" height="24" rx="6"/><rect x="90" y="14" width="54" height="24" rx="6"/>
      </g>
    </g>
    <g transform="translate(1180 770)" fill="#c99a5b" stroke="#7c5a2e" stroke-width="2">
      <rect x="0" y="70" width="320" height="18"/>
      <rect x="20" y="52" width="300" height="18"/>
      <rect x="40" y="34" width="280" height="18"/>
    </g>
    <g transform="translate(1060 820)">
      <rect x="0" y="0" width="70" height="44" fill="#ff8a00" rx="4"/>
      <path d="M0 14H70" stroke="#0b1121" stroke-width="3"/>
      <rect x="10" y="44" width="14" height="10" fill="#0b1121"/><rect x="46" y="44" width="14" height="10" fill="#0b1121"/>
    </g>
  </g>
</svg>
